<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Remoto Universal</title>
  <!-- Tailwind CSS por CDN CDN para asegurar estilos offline inmediatos -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Estilos 3D y diseño del control remoto */
    body {
      background-color: #0d0f12;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      touch-action: manipulation;
    }

    /* Variaciones de colores para la carcasa */
    .theme-black { background: linear-gradient(145deg, #1e2229, #111317); border-color: #2a2f38; }
    .theme-white { background: linear-gradient(145deg, #f5f5f5, #d4d4d4); border-color: #ffffff; }
    .theme-blue  { background: linear-gradient(145deg, #0f2b48, #071626); border-color: #1e4a78; }
    .theme-red   { background: linear-gradient(145deg, #480f0f, #260707); border-color: #781e1e; }
    .theme-brightgreen { background: linear-gradient(145deg, #15803d, #052e16); border-color: #22c55e; }
    .theme-orange{ background: linear-gradient(145deg, #ea580c, #7c2d12); border-color: #f97316; }
    .theme-yellow{ background: linear-gradient(145deg, #ca8a04, #713f12); border-color: #facc15; }
    .theme-gold  { background: linear-gradient(145deg, #bf953f, #aa771c, #8a5a00); border-color: #fcf6ba; }
    .theme-turquoise { background: linear-gradient(145deg, #0d9488, #115e59); border-color: #2dd4bf; }
    .theme-gray  { background: linear-gradient(145deg, #4b5563, #1f2937); border-color: #9ca3af; }
    .theme-brown { background: linear-gradient(145deg, #78350f, #451a03); border-color: #b45309; }

    /* Botones estilo 3D táctil sobresaliente */
    .btn-3d {
      position: relative;
      background: linear-gradient(145deg, #2c323d, #1a1e24);
      box-shadow: 4px 4px 8px #0a0b0e, -3px -3px 6px #323946;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.08s ease;
      color: #ffffff;
      font-weight: bold;
    }

    .theme-white .btn-3d {
      background: linear-gradient(145deg, #ffffff, #dcdcdc);
      box-shadow: 4px 4px 8px #b8b8b8, -3px -3px 6px #ffffff;
      color: #111111;
      border: 1px solid rgba(0, 0, 0, 0.1);
    }

    /* Estado al presionar: La letra/icono se pone VERDE brillante */
    .btn-3d:active {
      box-shadow: inset 3px 3px 6px #0a0b0e, inset -2px -2px 4px #323946 !important;
      transform: translateY(2px);
      color: #22c55e !important; /* Verde */
    }

    .btn-3d:active svg {
      fill: #22c55e !important;
      stroke: #22c55e !important;
    }

    /* Botón Encendido/Apagado (Rojo por defecto) */
    .btn-power {
      background: linear-gradient(145deg, #dc2626, #991b1b) !important;
      box-shadow: 4px 4px 10px #0a0b0e, -2px -2px 5px rgba(239, 68, 68, 0.3) !important;
      color: #ffffff !important;
      border: 1px solid #f87171 !important;
    }

    .btn-power:active {
      background: linear-gradient(145deg, #7f1d1d, #991b1b) !important;
      color: #ef4444 !important; /* Rojo brillante al presionar */
    }

    /* Emisor LED infrarrojo */
    .led-emitter {
      width: 14px;
      height: 14px;
      background-color: #450a0a;
      border: 2px solid #7f1d1d;
      border-radius: 50%;
      box-shadow: 0 0 4px #000;
      transition: background-color 0.1s ease, box-shadow 0.1s ease;
    }

    .led-active {
      background-color: #ef4444 !important;
      box-shadow: 0 0 14px #ef4444, 0 0 25px #ef4444 !important;
    }

    /* Selector de color de carcasa */
    .color-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      cursor: pointer;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3 sm:p-6 text-white">

  <!-- Selector de color de control remoto -->
  <div class="mb-4 flex flex-wrap items-center justify-center gap-1.5 bg-gray-900/90 px-3 py-2 rounded-2xl border border-gray-700 shadow-lg max-w-[340px]">
    <span class="text-[11px] font-semibold text-gray-300 w-full text-center mb-1">COLOR DE CARCASA:</span>
    <div onclick="setTheme('black')" class="color-dot bg-gray-950" title="Negro"></div>
    <div onclick="setTheme('white')" class="color-dot bg-gray-100" title="Blanco"></div>
    <div onclick="setTheme('blue')" class="color-dot bg-blue-900" title="Azul"></div>
    <div onclick="setTheme('red')" class="color-dot bg-red-900" title="Rojo"></div>
    <div onclick="setTheme('brightgreen')" class="color-dot bg-green-500" title="Verde brillante"></div>
    <div onclick="setTheme('orange')" class="color-dot bg-orange-600" title="Anaranjado"></div>
    <div onclick="setTheme('yellow')" class="color-dot bg-yellow-400" title="Amarillo"></div>
    <div onclick="setTheme('gold')" class="color-dot bg-amber-300" title="Dorado"></div>
    <div onclick="setTheme('turquoise')" class="color-dot bg-teal-400" title="Turquesa"></div>
    <div onclick="setTheme('gray')" class="color-dot bg-gray-500" title="Gris"></div>
    <div onclick="setTheme('brown')" class="color-dot bg-amber-900" title="Marrón"></div>
  </div>

  <!-- Cuerpo Principal del Control Remoto -->
  <div id="remoteCasing" class="remote-body w-full max-w-[340px] rounded-[42px] border-4 p-5 sm:p-6 flex flex-col items-center relative select-none theme-black shadow-2xl">
    
    <!-- Emisor IR (Parte Superior) -->
    <div class="w-full flex justify-center items-center mb-4 relative">
      <div id="ledEmitter" class="led-emitter"></div>
      <span class="absolute right-2 text-[10px] tracking-widest text-gray-400 font-bold uppercase">TOSHIBA / IR</span>
    </div>

    <!-- Pantalla de Estado / Código enviado -->
    <div class="w-full bg-black/60 border border-gray-700/60 rounded-xl p-2.5 mb-5 text-center shadow-inner">
      <div id="statusLabel" class="text-xs font-semibold text-green-400 truncate">LISTO (SIN PUBLICIDAD)</div>
      <div id="codeLabel" class="text-[10px] text-gray-400 tracking-wider font-mono mt-0.5">IR ESTÁNDAR 38kHz</div>
    </div>

    <!-- Botón Encendido y Silencio / Entrada (Fila Superior) -->
    <div class="w-full flex justify-between items-center mb-6 px-1">
      <button onclick="sendCommand('SILENCIO', 'Silenciar TV', '0x40BF10EF')" class="btn-3d w-14 h-14 rounded-full flex flex-col items-center justify-center text-[10px] font-bold">
        SILENCIO
      </button>
      
      <!-- BOTÓN DE ENCENDIDO PRINCIPAL -->
      <button onclick="sendCommand('ENCENDER/APAGAR', 'Encender/Apagar TV', '0x40BF00FF')" class="btn-3d btn-power w-16 h-16 rounded-full flex items-center justify-center text-lg shadow-lg">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </button>

      <button onclick="sendCommand('ENTRADA', 'Cambiar Entrada (HDMI/TV)', '0x40BF0F0E')" class="btn-3d w-14 h-14 rounded-full flex flex-col items-center justify-center text-[9px] font-bold">
        ENTRADA
      </button>
    </div>

    <!-- PAD DE NAVEGACIÓN (Flechas para Smart TV / Cajita) -->
    <div class="mb-6 flex flex-col items-center justify-center relative w-48 h-48 bg-black/30 rounded-full border border-gray-700/40 p-2">
      <!-- Flecha Arriba -->
      <button onclick="sendCommand('ARRIBA', 'Arriba', '0x40BF12ED')" class="btn-3d absolute top-1 w-12 h-12 rounded-t-2xl flex items-center justify-center">
        ▲
      </button>
      <!-- Flecha Izquierda -->
      <button onclick="sendCommand('IZQUIERDA', 'Izquierda', '0x40BF0ae5')" class="btn-3d absolute left-1 w-12 h-12 rounded-l-2xl flex items-center justify-center">
        ◄
      </button>
      <!-- Botón Central OK / ACEPTAR -->
      <button onclick="sendCommand('ACEPTAR', 'Aceptar / OK', '0x40BF16E9')" class="btn-3d w-14 h-14 rounded-full flex items-center justify-center text-xs font-black border-2 border-green-500/30">
        ACEPTAR
      </button>
      <!-- Flecha Derecha -->
      <button onclick="sendCommand('DERECHA', 'Derecha', '0x40BF1ee1')" class="btn-3d absolute right-1 w-12 h-12 rounded-r-2xl flex items-center justify-center">
        ►
      </button>
      <!-- Flecha Abajo -->
      <button onclick="sendCommand('ABAJO', 'Abajo', '0x40BF1fe0')" class="btn-3d absolute bottom-1 w-12 h-12 rounded-b-2xl flex items-center justify-center">
        ▼
      </button>
    </div>

    <!-- Controles de Volumen y Canales -->
    <div class="w-full grid grid-cols-2 gap-4 mb-5 px-2">
      <!-- Sección Volumen -->
      <div class="flex flex-col items-center bg-black/20 p-2 rounded-2xl border border-white/5">
        <span class="text-[10px] text-gray-400 font-bold mb-2">VOLUMEN</span>
        <button onclick="sendCommand('VOL_MAS', 'Subir Volumen', '0x40BF1aE5')" class="btn-3d w-full h-12 rounded-t-xl mb-1 flex items-center justify-center text-lg">
          +
        </button>
        <button onclick="sendCommand('VOL_MENOS', 'Bajar Volumen', '0x40BF1eE1')" class="btn-3d w-full h-12 rounded-b-xl flex items-center justify-center text-lg">
          -
        </button>
      </div>

      <!-- Sección Canales -->
      <div class="flex flex-col items-center bg-black/20 p-2 rounded-2xl border border-white/5">
        <span class="text-[10px] text-gray-400 font-bold mb-2">CANAL</span>
        <button onclick="sendCommand('CANAL_MAS', 'Canal Arriba', '0x40BF1fE0')" class="btn-3d w-full h-12 rounded-t-xl mb-1 flex items-center justify-center text-xs font-bold">
          CH ▲
        </button>
        <button onclick="sendCommand('CANAL_MENOS', 'Canal Abajo', '0x40BF10EF')" class="btn-3d w-full h-12 rounded-b-xl flex items-center justify-center text-xs font-bold">
          CH ▼
        </button>
      </div>
    </div>

    <!-- Teclado Numérico Directo -->
    <div class="w-full grid grid-cols-3 gap-2 px-2 mb-2">
      <button onclick="sendCommand('1', 'Canal 1', '0x40BF01FE')" class="btn-3d h-10 rounded-lg text-sm">1</button>
      <button onclick="sendCommand('2', 'Canal 2', '0x40BF02FD')" class="btn-3d h-10 rounded-lg text-sm">2</button>
      <button onclick="sendCommand('3', 'Canal 3', '0x40BF03FC')" class="btn-3d h-10 rounded-lg text-sm">3</button>
      <button onclick="sendCommand('4', 'Canal 4', '0x40BF04FB')" class="btn-3d h-10 rounded-lg text-sm">4</button>
      <button onclick="sendCommand('5', 'Canal 5', '0x40BF05FA')" class="btn-3d h-10 rounded-lg text-sm">5</button>
      <button onclick="sendCommand('6', 'Canal 6', '0x40BF06F9')" class="btn-3d h-10 rounded-lg text-sm">6</button>
      <button onclick="sendCommand('7', 'Canal 7', '0x40BF07F8')" class="btn-3d h-10 rounded-lg text-sm">7</button>
      <button onclick="sendCommand('8', 'Canal 8', '0x40BF08F7')" class="btn-3d h-10 rounded-lg text-sm">8</button>
      <button onclick="sendCommand('9', 'Canal 9', '0x40BF09F6')" class="btn-3d h-10 rounded-lg text-sm">9</button>
      <button onclick="sendCommand('MENU', 'Menú TV', '0x40BF1ce3')" class="btn-3d h-10 rounded-lg text-[10px]">MENÚ</button>
      <button onclick="sendCommand('0', 'Canal 0', '0x40BF00FF')" class="btn-3d h-10 rounded-lg text-sm">0</button>
      <button onclick="sendCommand('SALIR', 'Volver / Salir', '0x40BF1de2')" class="btn-3d h-10 rounded-lg text-[10px]">SALIR</button>
    </div>

  </div>

  <!-- Lógica en JavaScript para funcionamiento Offline e Infrarrojos -->
  <script>
    let ledEmitter, statusLabel, codeLabel, remoteCasing;

    function getDOMElements() {
      ledEmitter = document.getElementById('ledEmitter');
      statusLabel = document.getElementById('statusLabel');
      codeLabel = document.getElementById('codeLabel');
      remoteCasing = document.getElementById('remoteCasing');
    }

    function setTheme(colorTheme) {
      if (!remoteCasing) getDOMElements();
      if (remoteCasing) {
        remoteCasing.className = 'remote-body w-full max-w-[340px] rounded-[42px] border-4 p-5 sm:p-6 flex flex-col items-center relative select-none shadow-2xl theme-' + colorTheme;
        localStorage.setItem('remote_theme', colorTheme);
      }
    }

    window.onload = function() {
      getDOMElements();
      const savedTheme = localStorage.getItem('remote_theme') || 'black';
      setTheme(savedTheme);

      // Registrar Service Worker para permitir funcionamiento 100% SIN INTERNET
      if ('serviceWorker' in navigator) {
        const swCode = `
          self.addEventListener('install', (e) => {
            e.waitUntil(caches.open('remote-offline-v1').then((cache) => cache.addAll(['./'])));
          });
          self.addEventListener('fetch', (e) => {
            e.respondWith(caches.match(e.request).then((res) => res || fetch(e.request)));
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
      }
    };

    function sendCommand(keyName, actionText, irCode) {
      if (!statusLabel || !codeLabel) getDOMElements();
      
      triggerLedEffect();
      if (statusLabel) statusLabel.innerText = actionText;
      if (codeLabel) codeLabel.innerText = 'Código: ' + irCode;

      if (navigator.vibrate) {
        navigator.vibrate(40);
      }

      emitIRHardwareSignal(irCode);
    }

    function triggerLedEffect() {
      if (!ledEmitter) getDOMElements();
      if (ledEmitter) {
        ledEmitter.classList.add('led-active');
        setTimeout(() => {
          ledEmitter.classList.remove('led-active');
        }, 150);
      }
    }

    function emitIRHardwareSignal(codeHex) {
      if (window.AndroidIR && typeof window.AndroidIR.transmit === 'function') {
        window.AndroidIR.transmit(38000, codeHex);
      } else {
        console.log(`[IR OFFLINE TRANSMIT] Código Toshiba/Universal: ${codeHex}`);
      }
    }
  </script>
</body>
</html>
